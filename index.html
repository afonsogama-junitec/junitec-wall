<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JUNITEC Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>JUNITEC <span>Wall</span></h1>
    <p>O mural da nossa sala. Cria o cartão de cada pessoa.</p>
  </header>

  <main>
    <section class="editor">
      <h2>Novo cartão</h2>
      <form id="form">
        <label>Nome
          <input name="name" required maxlength="30" placeholder="Ex.: Afonso Gama">
        </label>
        <div class="field">
          <span class="field-label">Emoji</span>
          <div class="emoji-row">
            <input name="emoji" maxlength="8" value="😎" aria-label="Emoji">
            <button type="button" id="emoji-btn" class="ghost" aria-expanded="false" aria-controls="emoji-panel">Escolher</button>
          </div>
          <div id="emoji-panel" hidden></div>
        </div>
        <label>Tecnologia favorita
          <input name="tech" maxlength="24" placeholder="Ex.: Python">
        </label>
        <label>Fun fact
          <textarea name="fact" maxlength="100" rows="3" placeholder="Algo que ninguém sabe sobre ti"></textarea>
        </label>
        <label>Cor
          <input type="color" name="color" value="#6c5ce7">
        </label>
        <button type="submit">Adicionar ao mural</button>
      </form>

      <h3>Pré-visualização</h3>
      <div id="preview"></div>
    </section>

    <section class="wall">
      <div class="wall-head">
        <h2>Mural <small id="count"></small></h2>
        <div class="tools">
          <button type="button" id="export" class="ghost">Exportar</button>
          <label class="ghost file">Importar<input type="file" id="import" accept="application/json" hidden></label>
        </div>
      </div>
      <div id="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
